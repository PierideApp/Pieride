[package]
name = "pieride"
version = "0.1.0"
description = "Piéride"
repository = "https://github.com/PierideApp/Pieride"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
# Sans la fonctionnalité `cookies` : elle écrit les cookies de session en clair sur le disque.
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }

# https://v2.tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
