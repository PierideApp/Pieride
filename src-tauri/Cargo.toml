[package]
name = "pieride"
version = "0.1.0"
description = "Piéride"
repository = "https://github.com/PierideApp/Pieride"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4"
libsqlite3-sys = "0.30"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri = { version = "2", features = ["tray-icon"] }
# Sans la fonctionnalité `cookies` : elle écrit les cookies de session en clair sur le disque.
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

# https://v2.tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
